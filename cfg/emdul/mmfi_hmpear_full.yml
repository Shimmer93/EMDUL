  params:
    pad_type: start
    clip_len: 5
- name: GetCentroid
  params:
    centroid_type: kps
- name: ToITOP
  params: null
- name: Normalize
  params:
    feat_scale: null
- name: RemoveOutliers
  params:
    outlier_type: box
    radius: 1.5
- name: ReduceKeypointLen
  params:
    only_one: true
    keep_type: end
    frame_to_reduce: 0
- name: Pad
  params:
    max_len: 256
- name: ToTensor
  params: null
predict_pipeline:
- name: UniformSample
  params:
    pad_type: start
    clip_len: 5
- name: GetCentroid
  params:
    centroid_type: kps
- name: ToITOP
  params: null
- name: Normalize
  params:
    feat_scale: null
- name: RemoveOutliers
  params:
    outlier_type: box
    radius: 1.5
- name: ReduceKeypointLen
  params:
    only_one: true
    keep_type: end
    frame_to_reduce: 0
- name: Pad
  params:
    max_len: 256
- name: ToTensor
  params: null
